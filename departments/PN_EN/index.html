            <section class='hero-slider' style='margin-bottom: 20px;'>
                <div class='slides-wrapper' id='slider'>
                    <div class='slide active'><img src='img/slide/04.jpg' alt='Slide 1'></div>
                    <div class='slide'><img src='img/slide/03.jpg' alt='Slide 2'></div>
                </div>
                <div class='slider-dots' id='sliderDots'></div>
            </section>
        </main>
        
        <script>
            (function () {
                const slides = document.querySelectorAll('.slide');
                const dotsContainer = document.getElementById('sliderDots');
                let currentSlide = 0;
                let slideInterval;

                if (slides.length === 0 || !dotsContainer) return;

                dotsContainer.innerHTML = '';
                slides.forEach((_, i) => {
                    const dot = document.createElement('span');
                    dot.classList.add('dot');
                    if (i === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => goToSlide(i));
                    dotsContainer.appendChild(dot);
                });

                const dots = document.querySelectorAll('.dot');

                function goToSlide(n) {
                    slides[currentSlide].classList.remove('active');
                    dots[currentSlide].classList.remove('active');
                    currentSlide = (n + slides.length) % slides.length;
                    slides[currentSlide].classList.add('active');
                    dots[currentSlide].classList.add('active');
                    resetInterval();
                }

                function resetInterval() {
                    clearInterval(slideInterval);
                    slideInterval = setInterval(() => goToSlide(currentSlide + 1), 5000);
                }

                resetInterval();
            })();
        </script>
